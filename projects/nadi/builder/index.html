<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbf8f1">
<meta name="description" content="NADI Builder — Buat website UMKM gratis dengan AI.">
<title>NADI Builder — Segera Hadir</title>
<link rel="icon" href="../favicon.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  background: #fbf8f1;
  color: #17283a;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  line-height: 1.6;
}
.card {
  background: #fffdf9;
  border: 1px solid #eae6dc;
  border-radius: 28px;
  padding: 48px 40px;
  max-width: 560px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 55px rgba(23, 40, 58, 0.08);
}
.logo {
  height: 56px;
  margin-bottom: 24px;
  display: inline-block;
}
h1 {
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 12px;
  background: linear-gradient(135deg, #ef6461 0%, #568bbd 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #fff1f0;
  color: #d95757;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 8px 16px;
  border-radius: 999px;
  margin-bottom: 20px;
}
.status::before {
  content: '';
  width: 8px;
  height: 8px;
  background: #ef6461;
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
  box-shadow: 0 0 12px #ef6461;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.35); opacity: 0.5; }
}
p {
  color: #4a5a6e;
  font-size: 1rem;
  margin-bottom: 32px;
  max-width: 420px;
  margin-left: auto;
  margin-right: auto;
}
.actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 24px;
  border-radius: 999px;
  font-size: 0.88rem;
  font-weight: 700;
  text-decoration: none;
  transition: all 0.2s;
}
.btn.primary {
  background: #17283a;
  color: #fff;
}
.btn.primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(23, 40, 58, 0.15);
}
.btn.secondary {
  background: #fff;
  color: #17283a;
  border: 1px solid #eae6dc;
}
.btn.secondary:hover {
  border-color: #ef6461;
  color: #ef6461;
  transform: translateY(-2px);
}
.note {
  font-size: 0.78rem;
  color: #87928b;
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px solid #eae6dc;
}
@media (max-width: 480px) {
  .card { padding: 36px 24px; }
  h1 { font-size: 1.5rem; }
  .actions { flex-direction: column; }
  .btn { justify-content: center; }
}
</style>
</head>
<body>

<div class="card">
  <img src="../logo.svg" alt="NADI" class="logo">
  
  <div class="status">Segera Hadir</div>
  
  <h1>NADI Builder</h1>
  
  <p>
    Mesin bikin website UMKM gratis sedang kami siapkan. 
    Isi data usaha Anda, lihat preview, dan publish dalam hitungan menit.
  </p>

  <div class="actions">
    <a class="btn primary" href="../#harga">
      <span>Lihat Paket</span>
      <span>↗</span>
    </a>
    <a class="btn secondary" href="../">
      ← Kembali ke Beranda
    </a>
  </div>

  <p class="note">
    Sementara ini, hubungi kami langsung via WhatsApp untuk pembuatan website custom.
  </p>
</div>

</body>
</html>
